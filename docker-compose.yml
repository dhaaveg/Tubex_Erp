version: '3.8'

services:
  erp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubex-erp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://erp_user:erp_secret_pass@erp-postgres:5432/tubex_erp?schema=public
      - DIRECT_URL=postgresql://erp_user:erp_secret_pass@erp-postgres:5432/tubex_erp?schema=public
      - SESSION_SECRET=eot_couplings_super_secret_auth_encryption_key_2026_vps_deploy
      - NEXT_PUBLIC_APP_URL=http://187.126.123.28:3000
      - PORT=3000
    depends_on:
      erp-postgres:
        condition: service_healthy

  erp-postgres:
    image: postgres:16-alpine
    container_name: tubex-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_secret_pass
      POSTGRES_DB: tubex_erp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d tubex_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
