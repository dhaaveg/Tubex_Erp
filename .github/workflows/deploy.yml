name: Enterprise ERP CI/CD & Production Build

on:
  push:
    branches: [main, test, master]
  pull_request:
    branches: [main, test, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5433/pipe_erp?schema=public"
  DIRECT_URL: "postgresql://postgres:password@127.0.0.1:5433/pipe_erp?schema=public"
  SESSION_SECRET: "ci_cd_placeholder_session_secret_for_automated_builds_and_tests"
  NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"

jobs:
  lint-and-validate:
    name: Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pipe_erp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Type Checking
        run: npx tsc --noEmit

      - name: Apply Prisma Schema to PostgreSQL Test Service
        run: npx prisma db push --accept-data-loss --skip-generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Seed Authentication, Role Matrix & Master Catalog
        run: |
          node scripts/seed-auth.mjs
          node scripts/seed-role-permissions.mjs
          node prisma/seed.js
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Start ERP Production Server for Integration Testing
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000/login -t 60000
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          PORT: 3000

      - name: Run Core Test Suite & URL Route Verification
        run: node scripts/verify-all-urls.mjs
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Run RBAC & Password Security Validation
        run: |
          node scripts/test-password-input.mjs
          node scripts/test-po-thread-removal.mjs
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

  build-production:
    name: Package Production Artifacts
    needs: [lint-and-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ env.NEXT_PUBLIC_APP_URL }}

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-production-build
          path: |
            .next/
            public/
            package.json
          retention-days: 7

  deploy-aws:
    name: Deploy to AWS (App Runner / ECS / RDS)
    needs: [build-production]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DB_URL: ${{ secrets.DATABASE_URL }}
      AWS_APP_RUNNER_ARN: ${{ secrets.AWS_APP_RUNNER_SERVICE_ARN }}
      AWS_ECS_CLUSTER: ${{ secrets.AWS_ECS_CLUSTER }}
      AWS_ECS_SERVICE: ${{ secrets.AWS_ECS_SERVICE }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.AWS_KEY != '' && env.AWS_SECRET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run Prisma Database Migrations against AWS RDS
        if: env.DB_URL != ''
        run: |
          npm ci --include=dev
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}

      - name: Trigger AWS App Runner Deployment
        if: env.AWS_APP_RUNNER_ARN != '' && env.AWS_KEY != ''
        run: |
          echo "Triggering AWS App Runner deployment for service: ${{ env.AWS_APP_RUNNER_ARN }}"
          aws apprunner start-deployment --service-arn ${{ env.AWS_APP_RUNNER_ARN }}

      - name: Trigger AWS ECS Fargate Deployment
        if: env.AWS_ECS_CLUSTER != '' && env.AWS_ECS_SERVICE != '' && env.AWS_KEY != ''
        run: |
          echo "Updating AWS ECS service: ${{ env.AWS_ECS_SERVICE }} in cluster: ${{ env.AWS_ECS_CLUSTER }}"
          aws ecs update-service --cluster ${{ env.AWS_ECS_CLUSTER }} --service ${{ env.AWS_ECS_SERVICE }} --force-new-deployment

      - name: Validate Deployment Configuration
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "ℹ️ Note: To enable automated AWS continuous deployment, configure the following repository secrets under GitHub Settings > Secrets and variables > Actions:"
            echo "  - DATABASE_URL: AWS RDS PostgreSQL connection string"
            echo "  - AWS_ACCESS_KEY_ID: AWS IAM deployment access key"
            echo "  - AWS_SECRET_ACCESS_KEY: AWS IAM deployment secret key"
            echo "  - AWS_REGION: (Optional, defaults to us-east-1)"
            echo "  - AWS_APP_RUNNER_SERVICE_ARN: (Optional, for AWS App Runner automatic deployment)"
            echo "  - AWS_ECS_CLUSTER / AWS_ECS_SERVICE: (Optional, for AWS ECS Fargate automatic deployment)"
          else
            echo "✅ Production AWS deployment commands executed successfully."
          fi
